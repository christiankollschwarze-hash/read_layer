<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>TÆLLA Labs – Gate-Monitor</title>
<script src="/vendor/codemirror6.min.js"></script>
<link rel="stylesheet" href="/vendor/taella.css"><script src="/vendor/marke.js" defer></script><script src="/vendor/hilfe.js"></script>
<style>
main{max-width:1200px;margin:0 auto}
.kettebar{position:sticky;top:57px;z-index:4;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 24px}
#editor{border:1px solid var(--line-2);border-radius:var(--r-s);height:460px;overflow:hidden}#editor .cm-editor{height:100%}
#editor .cm-gutters{background:var(--tint);border-right:1px solid var(--line);color:var(--ink-3)}
.feld{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;align-items:center}
.geaendert{color:var(--s-mensch);font-weight:600}
details.ausnahme{margin-top:10px}details.ausnahme summary{cursor:pointer;color:var(--ink-3);font-size:12px}
.dateien{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.dateien button.akt{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#ansicht{max-height:640px;overflow:auto;border-top:1px solid var(--line);padding-top:10px}
#ansicht img{max-width:100%;border-radius:var(--r-s)}
.paar{display:grid;grid-template-columns:44px 1fr 1fr 92px;gap:6px 12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.45}
.paar.kopf{font-weight:600;font-size:12px;color:var(--ink-3)}
.paar .neu{cursor:text}.paar .neu:hover{background:var(--tint)}
.paar textarea{width:100%;min-height:90px}
.paar.aus{background:color-mix(in srgb,var(--s-mensch) 7%,transparent)}
.k195{display:grid;grid-template-columns:28px 38px 1fr 90px 1fr;gap:4px 10px;align-items:center;font-size:13px;padding:2px 0}
.k195 .bal{height:10px;border-radius:3px;background:var(--tint)}
.schnitt{cursor:pointer;font-size:11px;color:var(--ink-3);text-align:center;border-top:1px dashed transparent;padding:1px 0}
.schnitt:hover{color:var(--ink);border-top-color:var(--line)}.schnitt.an{color:var(--s-mensch);border-top:2px solid var(--s-mensch);font-weight:600}
.liste120{max-height:75vh;overflow:auto;border-top:1px solid var(--line)}
.zw200{display:grid;grid-template-columns:1fr 1fr;gap:16px}.zw200>div{max-height:75vh;overflow:auto;border-top:1px solid var(--line);font-size:13px;line-height:1.5}
.ab{background:color-mix(in srgb,var(--s-stopp) 18%,transparent);border-radius:2px}
.kn{display:grid;grid-template-columns:120px 64px 1fr 30px;gap:4px 8px;padding:5px 0;border-bottom:1px solid var(--line);align-items:start}
.kn.ms{background:color-mix(in srgb,var(--s-mensch) 8%,transparent)}.kn.h{font-weight:600}
.kn .w{cursor:pointer}.kn .w:hover{text-decoration:underline}
.trenn{color:var(--s-mensch);font-weight:700;padding:0 2px}.zs{color:var(--s-mensch);font-weight:700}
.chip{display:inline-block;border:1px solid var(--line-2);border-radius:10px;padding:0 8px;margin:2px;font-size:12px;cursor:pointer}.chip.weg{text-decoration:line-through;color:var(--ink-3)}
.kapt td{padding:4px 6px}.kapt tr.sel{background:var(--tint)}
</style></head><body>
<header>
 <a class="marke" href="/"></a><span class="seitentitel">Gate-Monitor</span>
 <span id="kopfwerk"></span>
 <span style="margin-left:auto"></span>
 Nutzer <select id="wer" onchange="sessionStorage.setItem('wer',this.value);laden()"></select>
 <a id="zurueck" href="/werk">← Werkansicht</a>
</header>
<nav class="kettebar"><span class="schritt" id="kette"></span></nav>
<main>
 <div class="ampel a-ruhe" id="ampel"><span class="dot"></span><span id="ampeltext">–</span></div>
 <div class="box" id="gate"></div>
 <div id="inhalt"></div>
 <div class="box" id="ergebnis"><h2>Ergebnis</h2><div class="klein">lädt …</div></div>
 <div class="box" id="laufbox" style="display:none"><h2>Lauf</h2><div id="laufinfo" class="klein"></div><pre id="log">–</pre></div>
</main>
<script>
let M=null,poll=null,sahLaufen=false,ED=null,edOriginal=null,edGeaendert=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const zb=z=>`<span class="z ${esc(z)}">${esc(z)}</span>`;
async function api(p,body){const r=await fetch(p,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{});return r.json();}
function ziel(){const h=decodeURIComponent(location.hash.slice(1)).split("/");return {id:h[0]||"",stage:h[1]||""};}
const B=()=>encodeURIComponent(M.book_id);

async function start(){
  const n=await api("/api/nutzer");
  $("wer").innerHTML=n.nutzer.map(u=>`<option value="${esc(u.id)}" ${u.id==(sessionStorage.getItem("wer")||n.standard)?"selected":""}>${esc(u.id)} (${esc(u.rolle)})</option>`).join("");
  window.onhashchange=()=>{ED=null;laden();};
  laden();ampelPoll();
}
async function laden(){
  const z=ziel();if(!z.id){$("gate").innerHTML="Aufruf: /monitor#&lt;book-id&gt;/&lt;stage&gt;";return;}
  if(!z.stage){const w=await api(`/api/werk/${encodeURIComponent(z.id)}`);location.hash=`${z.id}/${(w.naechster||{}).stage||"100"}`;return;}
  const d=await api(`/api/werk/${encodeURIComponent(z.id)}/monitor/${z.stage}?wer=${encodeURIComponent($("wer").value)}`);
  if(d.fehler){$("gate").innerHTML=`<span class="err">${esc(d.fehler)}</span>`;return;}
  M=d;$("zurueck").href="/werk#"+encodeURIComponent(d.book_id);
  $("kopfwerk").innerHTML=`<b>${esc(d.titel)}</b> <span class="klein">${esc(d.book_id)}</span>`;
  $("kette").innerHTML=d.kette.map(k=>`<a class="${esc(k.zustand)} ${k.stage==d.stage.stage?"akt":""}" title="${esc(k.name)}: ${esc(k.zustand)}" href="#${esc(d.book_id)}/${k.stage}">${k.stage}</a>`).join("");
  document.title=`${d.stage.stage} ${d.stage.name} – ${d.book_id}`;
  ampelZeigen(d.ampel);gateZeigen();
  const mon=MON[d.stage.stage];
  if(d.daten_fehler)$("inhalt").innerHTML=`<div class="box err">Monitor-Daten: ${esc(d.daten_fehler)}</div>`;
  else if(mon&&d.daten){$("inhalt").innerHTML=mon.html(d.daten);mon.danach&&mon.danach(d.daten);}
  else $("inhalt").innerHTML=allgemein(d.stage);
  ergebnisLaden();
  laufZeigen(d.lauf);
}
// ---------- Rahmen: Gate-Kopf (Zustand, Befunde, Rücksprung, Ausnahme)
function gateZeigen(){
  const s=M.stage,r=M.rechte;
  const rs=s.ruecksprung_ziele||[];
  let h=`<h2>${s.stage} ${esc(s.name)} ${hilfeKnopf(s.stage)} ${zb(s.zustand)} <span class="klein">${esc(s.wer||"")} ${esc((s.wann||"").replace("T"," ").slice(0,16))}</span></h2>`;
  if(s.befunde.length)h+=`<div class="bef"><b>Befunde:</b><br>${s.befunde.map(esc).join("<br>")}</div>`;
  else if(s.gruende.length)h+=`<div class="hin">${s.gruende.map(esc).join("<br>")}</div>`;
  else h+=`<div class="klein">keine Befunde</div>`;
  if(s.hinweise.length)h+=`<div class="hin klein" style="margin-top:4px"><b>Hinweise:</b> ${s.hinweise.map(esc).join(" · ")}</div>`;
  const kn=[];
  if(r.lauf.ok){
    kn.push(`<button onclick="pruefen()">${s.stage} neu prüfen</button>`);
    for(const z of rs)if(z.ziel&&z.ziel!=s.stage)kn.push(`<button onclick="laufLos('ab','${esc(z.ziel)}')">Rücksprung ${esc(z.ziel)}${z.scope?" ("+esc(z.scope)+")":""}</button>`);
  }
  h+=kn.length?`<div class="akt">${kn.join("")}</div>`:"";
  if(s.zustand=="mensch"&&r.entscheiden.ok)h+=`<details class="ausnahme"><summary>Ausnahme: ohne Korrektur entscheiden (Grund Pflicht)</summary>
    <div class="akt"><input type="text" id="ausgrund" placeholder="Grund" size="40">${["frei","stopp"].map(n=>`<button onclick="entscheide('${n}')">${n}</button>`).join("")}</div></details>`;
  $("gate").innerHTML=h;
}
async function entscheide(nach){
  const grund=$("ausgrund").value.trim();if(!grund){alert("Grund ist Pflicht");return;}
  const r=await api(`/api/werk/${B()}/aktion`,{art:"entscheiden",stage:M.stage.stage,nach,grund,wer:$("wer").value});
  if(!r.ok)alert(r.fehler);laden();
}
function allgemein(s){
  const m=Object.entries(s.metriken||{});
  return `<div class="box"><h2>Daten des Gates</h2><div class="klein">Für diese Stage ist der Monitor noch nicht gebaut (GATE_MONITORE.md). Angezeigt: Prüfwerte und Teile; die Dateien stehen unter „Ergebnis“.</div>
   ${m.length?"<table>"+m.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")+"</table>":""}
   ${Object.entries(s.teile||{}).map(([sc,t])=>`<h3>${esc(sc)} ${zb(t.zustand)}</h3>${(t.gruende||[]).map(esc).join("<br>")}`).join("")}
   </div>`;
}
// ---------- Ergebnis der Stage (Dateien, JSON als aufklappbarer Baum)
let ERG=[],ergWahl=null;
async function ergebnisLaden(){
  const r=await api(`/api/werk/${B()}/ergebnis/${M.stage.stage}`);ERG=r.dateien||[];
  const gr=n=>n>1e6?(n/1e6).toFixed(1)+" MB":n>1e3?Math.round(n/1e3)+" kB":n+" B";
  if(!ERG.length){$("ergebnis").innerHTML=`<h2>Ergebnis</h2><div class="klein">${r.fehler?esc(r.fehler):"Diese Stage hat (noch) keine Ergebnisdateien."}</div>`;return;}
  if(!ERG.find(x=>x.datei==ergWahl))ergWahl=ERG[0].datei;
  $("ergebnis").innerHTML=`<h2>Ergebnis <span class="klein">${ERG.length} Datei(en)${r.gekappt?" (gekappt)":""}</span></h2>
   <div class="dateien">${ERG.map((x,i)=>`<button class="${x.datei==ergWahl?"akt":""}" title="${esc(x.datei)} · ${esc(x.wann.replace("T"," "))}" onclick="ergZeigen(${i})">${esc(x.name)} <span class="klein">${gr(x.groesse)}</span></button>`).join("")}</div>
   <div id="ansicht"></div>`;
  ergZeigen(ERG.findIndex(x=>x.datei==ergWahl));
}
async function ergZeigen(i){
  const x=ERG[i];ergWahl=x.datei;
  document.querySelectorAll("#ergebnis .dateien button").forEach((b,k)=>b.className=k==i?"akt":"");
  const url="/datei?p="+encodeURIComponent(x.datei),a=$("ansicht");
  const kopf=`<div class="klein" style="margin-bottom:8px">${esc(x.datei)} · ${esc(x.wann.replace("T"," "))} · <a target="_blank" href="${url}">roh öffnen</a></div>`;
  if(x.art=="bild"){a.innerHTML=kopf+`<img src="${url}">`;return;}
  if(x.art=="audio"){a.innerHTML=kopf+`<audio controls preload="none" src="${url}" style="width:100%"></audio>`;return;}
  if(x.art=="datei"){a.innerHTML=kopf+`<div class="klein">Binärdatei – nur „roh öffnen“.</div>`;return;}
  if(x.groesse>30e6){a.innerHTML=kopf+`<div class="klein">Zu groß für die Ansicht.</div>`;return;}
  a.innerHTML=kopf+`<div class="klein">lädt …</div>`;
  const t=await (await fetch(url)).text();
  if(x.art=="json"){
    let v=null;
    try{v=x.datei.endsWith(".jsonl")?t.split(/\r?\n/).filter(Boolean).map(z=>JSON.parse(z)):JSON.parse(t);}catch(e){}
    if(v!==null){a.innerHTML=kopf;const b=document.createElement("div");b.className="jb";b.appendChild(jsonKnoten(v,null,true));a.appendChild(b);return;}
  }
  const max=200000;a.innerHTML=kopf+`<pre style="max-height:600px">${esc(t.slice(0,max))}</pre>`+(t.length>max?`<div class="klein">… gekürzt (${t.length.toLocaleString("de")} Zeichen) – „roh öffnen“ zeigt alles.</div>`:"");
}
function jsonKnoten(v,k,offen){
  const key=k===null?"":`<span class="k">${esc(k)}</span>: `;
  if(v===null||typeof v!="object"){
    const d=document.createElement("div");d.className="zeile";
    d.innerHTML=key+(typeof v=="string"?`<span class="s">"${esc(v)}"</span>`:`<span class="zahl">${esc(String(v))}</span>`);return d;
  }
  const arr=Array.isArray(v),keys=arr?null:Object.keys(v),n=arr?v.length:keys.length;
  const det=document.createElement("details");
  const vor=arr?"[":"{",nach=arr?"]":"}";
  let kurz="";if(!arr){kurz=keys.slice(0,4).join(", ")+(n>4?", …":"");}
  det.innerHTML=`<summary>${key}${vor} <span class="n">${n} ${arr?"Einträge":"Felder"}${kurz?" · "+esc(kurz):""}</span> ${nach}</summary>`;
  let gebaut=0;const SCHRITT=200;
  const mehr=()=>{
    const bis=Math.min(n,gebaut+SCHRITT);
    for(let i=gebaut;i<bis;i++)det.appendChild(arr?jsonKnoten(v[i],i,false):jsonKnoten(v[keys[i]],keys[i],false));
    gebaut=bis;det.querySelector(":scope>.mehr")?.remove();
    if(gebaut<n){const b=document.createElement("button");b.className="mehr";b.style.margin="4px 0 4px 28px";b.textContent=`weitere ${Math.min(SCHRITT,n-gebaut)} von ${n-gebaut}`;b.onclick=mehr;det.appendChild(b);}
  };
  det.addEventListener("toggle",()=>{if(det.open&&!gebaut)mehr();});
  if(offen&&n){det.open=true;mehr();}
  return det;
}
// ---------- Lauf
async function laufLos(modus,von){
  if(!confirm(`run.py ${M.book_id} ${modus}${von?" "+von:""}${M.run_mode=="live"?"  [LIVE – kann kosten]":""}?`))return;
  const r=await api(`/api/werk/${B()}/lauf`,{modus,von,wer:$("wer").value});
  if(!r.ok)alert(r.fehler);else laufZeigen(r.lauf);
}
function pruefen(){laufLos("nur",M.stage.stage);}
async function speichern(eingabe){
  const body={...eingabe,wer:$("wer").value};
  const v=await api(`/api/werk/${B()}/monitor/${M.stage.stage}`,{...body,nur_vorschau:true});
  if(!v.ok){alert(v.fehler);return;}
  if(!confirm("Übernehmen und "+M.stage.stage+" neu prüfen?\n\n"+v.cmd.replace(/--rohtext-aus=\S+/,"--rohtext-aus=<Editor>")))return;
  const r=await api(`/api/werk/${B()}/monitor/${M.stage.stage}`,body);
  if(!r.ok)alert(r.fehler);else{ED=null;laufZeigen(r.lauf);return true;}
}
function laufZeigen(l){
  clearTimeout(poll);
  if(!l){$("laufbox").style.display="none";return;}
  $("laufbox").style.display="";
  const farbe={frei:"var(--g)",mensch:"var(--a)",stopp:"var(--r)",fehler:"var(--r)"}[l.deutung]||"var(--b)";
  $("laufinfo").innerHTML=`<b>${esc(l.art)}</b> · ${esc(l.start)} · <span style="color:${farbe}">${l.laeuft?"läuft …":"Exit "+l.exit+" = "+esc(l.deutung)}</span>`;
  const pre=$("log");pre.textContent=l.log;pre.scrollTop=pre.scrollHeight;
  if(l.laeuft){sahLaufen=true;poll=setTimeout(async()=>laufZeigen(await api(`/api/werk/${B()}/lauf`)),1500);}
  else if(sahLaufen){sahLaufen=false;laden();}
}
function ampelZeigen(a){if(!a)return;$("ampel").className="ampel a-"+a.farbe+(a.blink?" blink":"");$("ampeltext").textContent=a.text;}
async function ampelPoll(){try{if(M)ampelZeigen(await api(`/api/werk/${B()}/ampel`));}catch(e){}setTimeout(ampelPoll,4000);}

// ---------- Baustein Text-Editor (CodeMirror 6, lokal)
async function editorAuf(el,url){
  const txt=await (await fetch(url)).text();
  edGeaendert=false;
  ED=new CM.EditorView({parent:el,doc:txt,extensions:[CM.basicSetup,CM.EditorView.lineWrapping,
    CM.EditorView.updateListener.of(u=>{if(u.docChanged){edGeaendert=ED.state.doc.toString()!==edOriginal;const m=$("edstatus");if(m)m.innerHTML=edGeaendert?'<span class="geaendert">geändert – Grund nötig</span>':"unverändert";}})]});
  edOriginal=ED.state.doc.toString();
}
function zuZeile(n){if(!ED||!n)return;const l=ED.state.doc.line(Math.min(n,ED.state.doc.lines));ED.dispatch({selection:{anchor:l.from},effects:CM.EditorView.scrollIntoView(l.from,{y:"center"})});ED.focus();}
function dateiLaden(inp){const f=inp.files[0];if(!f||!ED)return;const r=new FileReader();r.onload=()=>{ED.dispatch({changes:{from:0,to:ED.state.doc.length,insert:r.result}});};r.readAsText(f,"utf-8");}

// ---------- Baustein PD-/Rechte-Nachweis (100 + 110)
function nwBaustein(mitUe){
  const arten={url:"PD-Beleg-URL",rechteinhaber:"Ich bin Rechteinhaber",andere_quelle:"PD über andere Quelle"};
  return `<fieldset><legend>PD-/Rechte-Nachweis hinzufügen (je Quelle)</legend>
   <div class="akt">${Object.entries(arten).map(([k,v])=>`<label><input type="radio" name="nwart" value="${k}" onchange="nwFelder()"> ${v}</label>`).join("")}<label><input type="radio" name="nwart" value="" checked onchange="nwFelder()"> keiner</label></div>
   <div id="nwfelder" style="display:none" class="feld">
    <span id="nw_url_l">URL</span><input type="text" id="nw_url" size="60" placeholder="https://…">
    <span id="nw_q_l">Quelle (Text)</span><input type="text" id="nw_quelle" size="60" placeholder="z. B. Verlagsvertrag, Nachlassverzeichnis …">
    <span id="nw_ra_l">Rechte</span><span id="nw_ra"><label><input type="radio" name="nwra" value="eigene" checked> eigene</label> <label><input type="radio" name="nwra" value="lizenz"> Lizenz</label></span>
    <span>deckt</span><span><label><input type="checkbox" id="nw_autor" checked> Autor</label> ${mitUe?`<label><input type="checkbox" id="nw_ue"> Übersetzer</label>`:""}</span>
   </div></fieldset>`;
}
function nwFelder(){
  const a=(document.querySelector("input[name=nwart]:checked")||{}).value;
  $("nwfelder").style.display=a?"":"none";
  const zeig=(id,on)=>{$(id).style.display=on?"":"none";};
  zeig("nw_url",a=="url"||a=="andere_quelle");zeig("nw_url_l",a=="url"||a=="andere_quelle");
  zeig("nw_quelle",a=="andere_quelle");zeig("nw_q_l",a=="andere_quelle");
  zeig("nw_ra",a=="rechteinhaber");zeig("nw_ra_l",a=="rechteinhaber");
  $("nw_url_l").textContent=a=="andere_quelle"?"URL (optional)":"URL";
}
function nwWert(){
  const art=(document.querySelector("input[name=nwart]:checked")||{}).value;
  if(!art)return null;
  return {art,url:$("nw_url").value,quelle:$("nw_quelle").value,rechte_art:(document.querySelector("input[name=nwra]:checked")||{}).value,
    deckt:[$("nw_autor").checked&&"autor",$("nw_ue")&&$("nw_ue").checked&&"uebersetzer"].filter(Boolean)};
}

// ---------- Monitore je Stage
const MON={};
MON["100"]={
  html(d){
    const pers=d.personen.map(p=>`<tr><td>${p.person=="autor"?"Autor":"Übersetzer"}</td><td>${esc(p.name)||"<span class='err'>unbekannt</span>"}</td>
      <td><input type="number" id="tj_${p.person}" value="${esc(p.todesjahr??"")}" style="width:80px"> <span class="klein">${esc(p.todesjahr_quelle||"")}</span></td>
      <td>${p.grenze!=null?`${p.todesjahr} + ${d.pd_jahre} = ${p.grenze} ${p.grenze<d.jahr?"&lt;":"≥"} ${d.jahr}`:"<span class='err'>Todesjahr fehlt</span>"}</td>
      <td><span class="pd ${p.ok?(p.per_nachweis?"nw":"ja"):"nein"}"></span>${p.ok?(p.per_nachweis?"frei per Nachweis":"gemeinfrei"):"nicht belegt"}${p.nachweise.length?`<div class="klein">${p.nachweise.map(esc).join("<br>")}</div>`:""}</td></tr>`).join("");
    const rt=d.rohtext,tq=d.textquelle||{};
    return `<div class="box"><h2>1 Anzeigen · 2 Bearbeiten</h2>
     <h3>Werk</h3><div class="feld">
      <span>Titel</span><b>${esc(d.titel)}</b>
      <span>Herkunft</span><span>${d.gutenberg_id?`Gutenberg <a target="_blank" href="${esc(d.gutenberg_link)}">#${esc(d.gutenberg_id)}</a>`:"mitgebrachte TXT"} · Eingang ${esc(d.quelle||"–")}</span>
      <span>Textquelle</span><span>${esc(tq.art||"–")} ${esc(tq.quelle||"")}${tq.bearbeitet?` <span class="klein">(im Editor bearbeitet ${esc(tq.wer||"")} ${esc((tq.wann||"").slice(0,16).replace("T"," "))})</span>`:""}</span>
      <span>Rechte</span><span>${esc(d.rechte_art||"–")}</span></div>
     <h3>Personen · PD-Ampel</h3>
     <table><tr><th>Person</th><th>Name</th><th>Todesjahr</th><th>EU-PD</th><th>Status</th></tr>${pers}</table>
     ${nwBaustein(d.personen.length>1)}
     <h3>Sprache</h3>
     <div class="akt">Quellsprache <select id="lg">${d.sprachliste.map(l=>`<option ${l==d.quellsprache?"selected":""}>${l}</option>`).join("")}${d.sprache_ok?"":`<option selected value="">${esc(d.quellsprache)} (nicht freigeschaltet)</option>`}</select>
      ${d.sprache_ok?"":`<span class="err">Sprache „${esc(d.quellsprache)}“ nicht freigeschaltet – Stopp. Freischaltung nur über die Sprachliste in config.</span>`}</div>
     <h3>Rohtext</h3>

    box.innerHTML=`<h2>2 Bearbeiten · Kapitel ${k}: ${esc(t.titel)}</h2>
     <div class="klein">Abweichungen markiert: ${t.fehlend} Wörter nur im Original, ${t.zusaetzlich} nur in den Knoten. ${t.knoten.length?"":"Keine Knoten – Kapitel noch nicht getaggt."}</div>
     <div class="zw200"><div><h3>Original (raw_modernized)</h3>${t.original.map(g=>g.aus?`<span class="ab">${esc(g.t)}</span>`:esc(g.t)).join("").replace(/\n/g,"<br>")}</div>
     <div><h3>Knoten</h3><div id="kn200"></div></div></div>`;
    this.knoten();
  },
  knoten(){
    const t=this.T,E=this.E,typen=M.daten.typen;
    $("kn200").innerHTML=t.knoten.map((n,i)=>{
      if(n.typ=="h")return `<div class="kn h"><span class="klein">${esc(n.id)}</span><span>h</span><span>${esc(n.text)}</span><span></span></div>`;
      const sp=n.id in E.teilen?n.text.indexOf(E.teilen[n.id]):-1;let pos=0,h="";
      for(const g of n.seg){let x="";for(const w of g.t.split(/(\s+)/)){if(!w)continue;
        if(pos==sp&&sp>0)x+='<span class="trenn">‖</span>';
        x+=/\s/.test(w)?esc(w):`<span class="w" onclick="MON['200'].tl(${i},${pos})">${esc(w)}</span>`;pos+=w.length;}
        h+=g.aus?`<span class="ab">${x}</span>`:x;}
      const ty=E.typ[n.id]||n.typ,zs=E.zusammen.has(n.id);
      return `<div class="kn ${n.mehrsatz?"ms":""}"><span class="klein">${esc(n.id)}${n.mehrsatz?'<br><span class="z mensch">Mehrsatz</span>':""}</span>
        <span><select onchange="MON['200'].ty(${i},this.value)" ${ty!=n.typ?'class="geaendert"':""}>${typen.map(x=>`<option ${x==ty?"selected":""}>${x}</option>`).join("")}</select></span>
        <span>${h||'<span class="klein">–</span>'}${zs?' <span class="zs">⊕ + folgender</span>':""}</span>
        <span>${n.text?`<button title="mit folgendem Knoten zusammenführen" onclick="MON['200'].zu(${i})">⊕</button>`:""}</span></div>`;}).join("");
  },
  tl(i,pos){
    const n=this.T.knoten[i],E=this.E;
    if(pos==0){alert("Am Knotenanfang wird nicht geteilt.");return;}
    if(n.id in E.teilen&&n.text.indexOf(E.teilen[n.id])==pos){delete E.teilen[n.id];}
    else{if(this.belegt(n.id,"teilen")){alert("Für diesen Knoten ist schon eine andere Korrektur vorgemerkt.");return;}
      const r=n.text.slice(pos);let st=null;
      for(let k=Math.min(8,r.length);k<=r.length;k++){if(k<r.length&&!/\s/.test(r[k]))continue;if(n.text.indexOf(r.slice(0,k))==pos){st=r.slice(0,k);break;}}
      if(!st){alert("Stelle nicht eindeutig.");return;}E.teilen[n.id]=st;}
    const c=$("ms_"+n.id);if(c)c.checked=E.teilen[n.id]===(M.daten.mehrsatz.find(m=>m.id==n.id)||{}).vorschlag;
    this.knoten();this.zf();
  },
  zu(i){const n=this.T.knoten[i],E=this.E;
    if(E.zusammen.has(n.id))E.zusammen.delete(n.id);
    else{if(this.belegt(n.id,"zusammen")){alert("Für diesen Knoten ist schon eine andere Korrektur vorgemerkt.");return;}E.zusammen.add(n.id);}
    this.knoten();this.zf();},
  ty(i,v){const n=this.T.knoten[i],E=this.E;
    if(v==n.typ){delete E.typ[n.id];}
    else{if(this.belegt(n.id,"typ")){alert("Für diesen Knoten ist schon eine andere Korrektur vorgemerkt.");this.knoten();return;}E.typ[n.id]=v;}
    this.knoten();this.zf();},
  los(trocken){
    const d=M.daten,E=this.E,e={};
    if($("mo200").value!=d.modell)e.modell=$("mo200").value;
    if(+$("la200").value!=d.lang_max)e.lang=$("la200").value;
    if(E.alle)e.kapitel=["alle"];else if(E.kapitel.size)e.kapitel=[...E.kapitel];
    if(Object.keys(E.teilen).length)e.teilen=Object.entries(E.teilen);
    if(E.zusammen.size)e.zusammen=[...E.zusammen];
    if(Object.keys(E.typ).length)e.typ=E.typ;
    if(E.abk.length)e.abk=E.abk;
    if(E.abk_weg.size)e.abk_weg=[...E.abk_weg];
    if(trocken)e.trocken=true;
    if(!trocken&&!Object.keys(e).length&&!confirm("Nichts geändert – 200 nur neu prüfen?"))return;
    if(!trocken&&e.kapitel&&!confirm(`Neu-Taggen kostet im Live-Modus (Schätzung ${E.alle?d.kosten_alle.toFixed(3):d.kapitel.filter(k=>E.kapitel.has(k.n)).reduce((a,k)=>a+k.kosten,0).toFixed(4)} $). Weiter?`))return;
    speichern(e).then(ok=>{if(ok&&!trocken){this.E=this.leer();this.K=null;}});
  }
};

      <td>${!p.ok&&(p.ruecksprung||d.ruecksprung)?`<a href="#${esc(M.book_id)}/${esc(p.ruecksprung||d.ruecksprung)}">→ ${esc(p.ruecksprung||d.ruecksprung)}</a>`:""}</td></tr>`;

      <span>Werk</span><span>${esc(m.quelle||"?")} · Fassung ${esc(m.fassung||"?")} · Mandant ${esc(m.mandant||"?")} · Ziel ${esc((m.zielsprachen||[]).join(", ")||"–")}</span>
      <span>Text</span><span>${m.kapitel??"?"} Kapitel · ${m.woerter!=null?m.woerter.toLocaleString("de-DE")+" Wörter":"?"} · ${m.zeichen!=null?m.zeichen.toLocaleString("de-DE")+" Zeichen":"?"}</span></div>
     <table style="margin-top:10px"><tr><th></th><th>Prüfung</th><th>Wert</th><th>korrigieren in</th></tr>
      ${offen.map(zeile).join("")}${d.pruefungen.filter(p=>p.ok).map(zeile).join("")}</table>
    </div>
    <div class="box"><h2>3 Speichern · 4 Freigeben</h2>
     <div class="klein">190 hat keine Regler: Fehler werden in der Stage behoben, deren Datei fehlt (Link „→“). Danach oben „190 neu prüfen“. Ein Stopp lässt sich nur per Admin-Ausnahme freigeben.</div></div>`;
  }
};
start();
