<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>TÆLLA Labs – Gate-Monitor</title>
<script src="/vendor/codemirror6.min.js"></script>
<link rel="stylesheet" href="/vendor/taella.css"><script src="/vendor/marke.js" defer></script><script src="/vendor/hilfe.js"></script>
<style>
main{max-width:1200px;margin:0 auto}
.kettebar{position:sticky;top:57px;z-index:4;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 24px}
#editor{border:1px solid var(--line-2);border-radius:var(--r-s);height:460px;overflow:hidden}#editor .cm-editor{height:100%}
#editor .cm-gutters{background:var(--tint);border-right:1px solid var(--line);color:var(--ink-3)}
.feld{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;align-items:center}
.geaendert{color:var(--s-mensch);font-weight:600}
details.ausnahme{margin-top:10px}
.freigabe{margin-top:12px;padding:12px 14px;border:2px solid var(--s-mensch);border-radius:var(--r-s);background:color-mix(in srgb,var(--s-mensch) 6%,transparent)}
#kette a.veraltet{border-style:dashed;border-color:var(--s-mensch)}
.schritt{border:2px solid var(--ink)}.schritt h2{margin-bottom:4px}a.knopf{display:inline-block;padding:9px 18px;border:1px solid var(--ink);border-radius:999px;text-decoration:none;font:600 13px/1 var(--ui)}a.knopf.haupt{background:var(--ink);color:var(--paper)}
.freigabe h3{margin:0 0 4px}details.ausnahme summary{cursor:pointer;color:var(--ink-3);font-size:12px}
.dateien{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.dateien button.akt{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#ansicht{max-height:640px;overflow:auto;border-top:1px solid var(--line);padding-top:10px}
#ansicht img{max-width:100%;border-radius:var(--r-s)}
.paar{display:grid;grid-template-columns:44px 1fr 1fr 92px;gap:6px 12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.45}
.paar.kopf{font-weight:600;font-size:12px;color:var(--ink-3)}
.paar .neu{cursor:text}.paar .neu:hover{background:var(--tint)}
.paar textarea{width:100%;min-height:90px}
.paar.aus{background:color-mix(in srgb,var(--s-mensch) 7%,transparent)}
.k195{display:grid;grid-template-columns:28px 38px 1fr 90px 1fr;gap:4px 10px;align-items:center;font-size:13px;padding:2px 0}
.k195 .bal{height:10px;border-radius:3px;background:var(--tint)}
.schnitt{cursor:pointer;font-size:11px;color:var(--ink-3);text-align:center;border-top:1px dashed transparent;padding:1px 0}
.schnitt:hover{color:var(--ink);border-top-color:var(--line)}.schnitt.an{color:var(--s-mensch);border-top:2px solid var(--s-mensch);font-weight:600}
.liste120{max-height:75vh;overflow:auto;border-top:1px solid var(--line)}
.zw200{display:grid;grid-template-columns:1fr 1fr;gap:16px}.zw200>div{max-height:75vh;overflow:auto;border-top:1px solid var(--line);font-size:13px;line-height:1.5}
.ab{background:color-mix(in srgb,var(--s-stopp) 18%,transparent);border-radius:2px}
.kn{display:grid;grid-template-columns:120px 64px 1fr 30px;gap:4px 8px;padding:5px 0;border-bottom:1px solid var(--line);align-items:start}
.kn.ms{background:color-mix(in srgb,var(--s-mensch) 8%,transparent)}.kn.h{font-weight:600}
.kn .w{cursor:pointer}.kn .w:hover{text-decoration:underline}
.trenn{color:var(--s-mensch);font-weight:700;padding:0 2px}.zs{color:var(--s-mensch);font-weight:700}
.t210 td{padding:3px 5px;vertical-align:top}.t210 input{width:100%;min-width:90px}.t210 tr.weg td{opacity:.45;text-decoration:line-through}
.t210 tr.sel{background:var(--tint)}.fs210{font-size:13px;line-height:1.5;border-top:1px solid var(--line);padding:6px 0}.fs210 b{background:color-mix(in srgb,var(--s-mensch) 20%,transparent)}
.chip{display:inline-block;border:1px solid var(--line-2);border-radius:10px;padding:0 8px;margin:2px;font-size:12px;cursor:pointer}.chip.weg{text-decoration:line-through;color:var(--ink-3)}
.b310{display:grid;grid-template-columns:110px 1fr 1fr 230px;gap:6px 12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.45}
.b310.kopf{font-weight:600;font-size:12px;color:var(--ink-3)}.b310.geaendert{background:color-mix(in srgb,var(--s-mensch) 7%,transparent);font-weight:400}
.b310 .neu{cursor:text}.b310 .neu:hover{background:var(--tint)}.b310 textarea{width:100%;min-height:80px}
.kapt td{padding:4px 6px}.kapt tr.sel{background:var(--tint)}
.b330{display:grid;grid-template-columns:110px 1fr 1fr 1fr 230px;gap:6px 12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.45}
.b330.kopf{font-weight:600;font-size:12px;color:var(--ink-3)}.b330.geaendert{background:color-mix(in srgb,var(--s-mensch) 7%,transparent);font-weight:400}
.b330 .neu{cursor:text}.b330 .neu:hover{background:var(--tint)}.b330 textarea{width:100%;min-height:80px}
.s340{border-bottom:1px solid var(--line);padding:10px 0}.kopf340{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.q340,.z340{font-size:14px;line-height:2;margin:2px 0}.z340{color:var(--ink-2)}
.qw,.zw{cursor:pointer;border-radius:3px;padding:1px 2px;border-bottom:2px solid transparent}
.qw.ur{border-bottom-color:var(--s-stopp)}.qw.vs{border-bottom-color:var(--s-mensch);border-bottom-style:double;border-bottom-width:3px}
.qw.dp{border-bottom-color:#8a4fd0}.qw.oa{border-bottom:2px dashed var(--s-stopp)}.qw.ma{font-weight:700}
.qw.ge{outline:2px solid var(--s-mensch)}.qw.sel{outline:2px solid var(--ink)}
.zw.hla{outline:2px solid var(--ink)}.zw.hlp{box-shadow:inset 0 0 0 2px var(--s-mensch);border-bottom:2px dashed var(--s-mensch)}
.l340 .qw{cursor:default;margin-left:6px}
.qw.hla{background:color-mix(in srgb,var(--s-frei) 35%,transparent);outline:2px solid var(--s-frei)}
.t095 td{padding:6px 8px;vertical-align:top}.t095 select{margin-right:6px}
.b400{display:grid;grid-template-columns:110px 1fr 1fr 190px;gap:6px 12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.45}
.b400.kopf{font-weight:600;font-size:12px;color:var(--ink-3)}.b400.geaendert{background:color-mix(in srgb,var(--s-mensch) 7%,transparent)}
.b400 .neu{cursor:text}.b400 .neu:hover{background:var(--tint)}.b400 textarea{width:100%;min-height:70px}
.d400a{background:color-mix(in srgb,var(--s-stopp) 16%,transparent);border-radius:2px}.d400b{background:color-mix(in srgb,var(--s-frei) 22%,transparent);border-radius:2px}
.d420{border-bottom:1px solid var(--line);padding:8px 0}.d420.geaendert{background:color-mix(in srgb,var(--s-mensch) 6%,transparent)}
.dz{display:grid;grid-template-columns:150px 1fr;gap:8px;font-size:14px;line-height:1.5;padding:1px 0}.dsp{font-variant:small-caps;font-weight:600;font-size:12px;letter-spacing:.04em}
.dz .w{cursor:pointer}.dz .w:hover{background:var(--tint)}
.t400 td{padding:3px 6px;vertical-align:top}.t400 input[type=text],.t400 td input:not([type]){width:100%;min-width:160px}.t400 tr.ohne{background:color-mix(in srgb,var(--s-mensch) 7%,transparent)}
.kt600{display:grid;gap:18px}.kt600>div{border-top:1px solid var(--line);padding-top:6px}
.kb600{margin:8px 0;font-size:14px;line-height:1.55}.kd600{font-style:italic}
.st600.ed{cursor:text}.st600.ed:hover{background:var(--tint)}.st600.bf{background:color-mix(in srgb,var(--s-stopp) 16%,transparent);border-radius:2px}
.zw610{display:grid;grid-template-columns:340px 1fr;gap:18px}.b610{width:100%;border:1px solid var(--line);border-radius:var(--r-s)}
.gal610{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.gal610>div{border:1px solid var(--line);border-radius:var(--r-s);padding:6px}.gal610>div.sel{border:2px solid var(--ink)}.gal610 img{width:100%}
.gal615{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.gal615 img{width:100%;border:1px solid var(--line);border-radius:var(--r-s)}.gal615 img.vorschau{outline:2px solid var(--s-mensch)}
.kopf615{margin-bottom:4px}.leer615{height:280px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line)}
.schritt a.mit{font-size:9px;padding:3px 6px;color:var(--ink-3);border-style:dashed}
.schritt a.mit::before{width:4px;height:4px}
.mitl{margin-top:6px;padding:4px 8px;border-left:2px dashed var(--line);font-size:12px;color:var(--ink-3)}
.mitl.halt{color:inherit;border-left-color:var(--s-stopp)}
.fsbar{display:inline-block;width:240px;height:10px;border:1px solid #8886;border-radius:5px;overflow:hidden;vertical-align:middle;background:#8881}
.fsbar>span{display:block;height:100%;background:var(--s-frei,#3a3);transition:width .8s}
.fsbar.k{width:80px;height:7px;margin-left:6px}
</style></head><body>
<header>
 <a class="marke" href="/"></a><span class="seitentitel">Gate-Monitor</span>
 <span id="kopfwerk"></span>
 <span style="margin-left:auto"></span>
 Nutzer <select id="wer" onchange="sessionStorage.setItem('wer',this.value);laden()"></select>
 <a id="zurueck" href="/werk">← Werkansicht</a>
</header>
<nav class="kettebar"><span class="schritt" id="kette"></span></nav>
<main>
 <div class="ampel a-ruhe" id="ampel"><span class="dot"></span><span id="ampeltext">–</span></div>
 <div class="box" id="gate"></div>
 <div id="schritt0"></div>
 <div id="inhalt"></div>
 <div id="freigabe2"></div>
 <div class="box" id="ergebnis"><h2>Ergebnis</h2><div class="klein">lädt …</div></div>
 <div class="box" id="laufbox" style="display:none"><h2>Lauf</h2><div id="laufinfo" class="klein"></div><pre id="log">–</pre></div>
</main>
<script>
let HILFE={},M=null,poll=null,sahLaufen=false,ED=null,edOriginal=null,edGeaendert=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const zb=z=>`<span class="z ${esc(z)}">${esc(z)}</span>`;
async function api(p,body){const r=await fetch(p,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{});return r.json();}
function ziel(){const h=decodeURIComponent(location.hash.slice(1)).split("/");return {id:h[0]||"",stage:h[1]||""};}
const B=()=>encodeURIComponent(M.book_id);

async function start(){
  const n=await api("/api/nutzer");
  $("wer").innerHTML=n.nutzer.map(u=>`<option value="${esc(u.id)}" ${u.id==(sessionStorage.getItem("wer")||n.standard)?"selected":""}>${esc(u.id)} (${esc(u.rolle)})</option>`).join("");
  try{HILFE=await (await fetch("/api/hilfe")).json();}catch(e){HILFE={};}
  window.onhashchange=()=>{ED=null;laden();};
  laden();ampelPoll();
}
async function laden(){
  const z=ziel();if(!z.id){$("gate").innerHTML="Aufruf: /monitor#&lt;book-id&gt;/&lt;stage&gt;";return;}
  if(!z.stage){const w=await api(`/api/werk/${encodeURIComponent(z.id)}`);const n=w.naechster||{};location.hash=`${z.id}/${n.monitor||n.stage||"100"}`;return;}
  const d=await api(`/api/werk/${encodeURIComponent(z.id)}/monitor/${z.stage}?wer=${encodeURIComponent($("wer").value)}`);
  if(d.fehler){$("gate").innerHTML=`<span class="err">${esc(d.fehler)}</span>`;return;}
  M=d;$("zurueck").href="/werk#"+encodeURIComponent(d.book_id);
  $("kopfwerk").innerHTML=`<b>${esc(d.titel)}</b> <span class="klein">${esc(d.book_id)}</span>`;
  $("kette").innerHTML=d.kette.map(k=>k.nachbar
   ?`<a class="mit ${esc(k.zustand)} ${k.stage==d.stage.stage?"akt":""}" title="${esc(k.name)}: ${esc(k.zustand)} – läuft mit ${esc(k.nachbar)}" href="#${esc(d.book_id)}/${k.nachbar}">${k.stage}</a>`
   :`<a class="${esc(k.zustand)} ${k.stage==d.stage.stage?"akt":""} ${k.veraltet?"veraltet":""}" title="${esc(k.name)}: ${esc(k.zustand)}${k.veraltet?" – veraltet, neu laufen lassen":""}" href="#${esc(d.book_id)}/${k.stage}">${k.stage}${k.veraltet?" ↻":""}</a>`).join("");
  document.title=`${d.stage.stage} ${d.stage.name} – ${d.book_id}`;
  LAUF=d.lauf||null;ampelZeigen(d.ampel);gateZeigen();
  const mon=MON[d.stage.stage];
  $("schritt0").innerHTML=mon&&mon.naechster&&d.daten?"":naechsterStandard();
  if(d.daten_fehler)$("inhalt").innerHTML=`<div class="box err">Monitor-Daten: ${esc(d.daten_fehler)}</div>`;
  else if(mon&&d.daten){$("inhalt").innerHTML=mon.html(d.daten);mon.danach&&mon.danach(d.daten);}
  else $("inhalt").innerHTML=allgemein(d.stage);
  ergebnisLaden();
  laufZeigen(d.lauf);
}
// ---------- Rahmen: Gate-Kopf (Zustand, Befunde, Rücksprung, Ausnahme)
let LAUF=null;   // aktiver Lauf des Werks (Gate-Kopf zeigt dann "läuft" statt alter Befunde)
function laufCmd(l){const c=Array.isArray(l.cmd)?l.cmd.join(" "):String(l.cmd||"");const m=c.match(/pipeline\.s(\d{3})_\w+|run\.py\s+\S+(.*)$/);return m?(m[1]?"Stage "+m[1]:"run.py"+(m[2]||"")):c.slice(0,80);}
function gateZeigen(){
  const s=M.stage,r=M.rechte;
  const rs=s.ruecksprung_ziele||[];
  if(LAUF&&LAUF.laeuft){
    $("gate").innerHTML=`<h2>${s.stage} ${esc(s.name)} ${hilfeKnopf(s.stage)} <span class="z laeuft">läuft</span> <span class="klein">seit ${esc(String(LAUF.start||"").replace("T"," ").slice(0,16))}</span></h2>
     <div id="fsgate" style="margin:4px 0"></div>
     <div class="hin">Ein Lauf ist aktiv (${esc(LAUF.art||"")} · ${esc(laufCmd(LAUF))}). Befunde und Entscheidung erscheinen, sobald der Lauf fertig ist – Fortschritt unten im Kasten „Lauf“.</div>
     <div class="klein" style="margin-top:4px">Letzter Stand vor dem Lauf: ${esc(s.zustand)}${s.wann?" · "+esc(s.wann.replace("T"," ").slice(0,16)):""}</div>`;
    const f2=$("freigabe2");if(f2)f2.innerHTML="";fsGate();return;
  }
  let h=`<h2>${s.stage} ${esc(s.name)} ${hilfeKnopf(s.stage)} ${zb(s.zustand)} <span class="klein">${esc(s.wer||"")} ${esc((s.wann||"").replace("T"," ").slice(0,16))}</span></h2>`;
  if(s.befunde.length)h+=`<div class="bef"><b>Befunde:</b><br>${s.befunde.map(esc).join("<br>")}</div>`;
  else if(s.gruende.length)h+=`<div class="hin">${s.gruende.map(esc).join("<br>")}</div>`;
  else h+=`<div class="klein">keine Befunde</div>`;
  if(s.hinweise.length)h+=`<div class="hin klein" style="margin-top:4px"><b>Hinweise:</b> ${s.hinweise.map(esc).join(" · ")}</div>`;
  h+=mitHtml(s);
  const kn=[];
  if(r.lauf.ok){
    kn.push(`<button onclick="pruefen()">${s.stage} neu prüfen</button>`);
    for(const z of rs)if(z.ziel&&z.ziel!=s.stage)kn.push(`<button onclick="laufLos('ab','${esc(z.ziel)}')">Rücksprung ${esc(z.ziel)}${z.scope?" ("+esc(z.scope)+")":""}</button>`);
  }
  h+=kn.length?`<div class="akt">${kn.join("")}</div>`:"";
  if(s.zustand=="mensch"&&r.entscheiden.ok)h+=freigabeHtml("1");
  $("gate").innerHTML=h;
  const f2=$("freigabe2");if(f2)f2.innerHTML=s.zustand=="mensch"&&r.entscheiden.ok?`<div class="box">${freigabeHtml("2")}</div>`:"";
}
// Nachbar-Stages (21.11.2026): laufen mit dieser Stage, Befunde und Rücksprung erscheinen hier
function mitHtml(s){
  return (M.mitlaeufer||[]).map(m=>{
    const halt=["stopp","mensch"].includes(m.zustand),rs=m.ruecksprung_ziele||[];
    let h=`<div class="mitl ${halt?"halt":""}">↳ <b>${m.stage} ${esc(m.name)}</b> ${zb(m.zustand)} <span class="klein">läuft automatisch mit ${s.stage}</span>`;
    if(halt){
      h+=m.befunde.length?`<div class="bef">${m.befunde.map(esc).join("<br>")}</div>`:(m.gruende.length?`<div class="hin">${m.gruende.map(esc).join("<br>")}</div>`:"");
      if(M.rechte.lauf.ok&&rs.length)h+=`<div class="akt">${rs.map(z=>`<button onclick="laufLos('ab','${esc(z.ziel)}')">Rücksprung ${esc(z.ziel)}${z.scope?" ("+esc(z.scope)+")":""}</button>`).join("")}</div>`;
    }
    return h+"</div>";
  }).join("");
}
function freigabeHtml(k){
  if(M.stage.nur_kosten)return `<div class="freigabe"><h3>Kostenfreigabe nötig</h3>
   <div class="klein">${M.stage.stage} wartet nur auf die Kostenfreigabe. „Freigeben – weiter in der Kette“ würde nichts vertonen und ist hier gesperrt: Kostenfreigabe je Sprache unten im Monitor erteilen – danach läuft ${M.stage.stage} los.</div>
   <div class="akt"><input type="text" id="ausgrund${k}" placeholder="Begründung (Pflicht)" size="52">
    <button onclick="entscheide('stopp','${k}')">Anhalten (Stopp)</button></div></div>`;
  const mon=MON[M.stage.stage];
  if(mon&&mon.entscheidungText&&M.daten)return `<div class="freigabe"><h3>Entscheidung nötig</h3>
   <div>${mon.entscheidungText(M.daten)}</div>
   <div class="akt"><input type="text" id="ausgrund${k}" placeholder="Begründung (Pflicht), z. B. angehört, klingt richtig" size="52">
    <button class="haupt" onclick="entscheide('frei','${k}')">Freigeben – weiter in der Kette</button>
    <button onclick="entscheide('stopp','${k}')">Anhalten (Stopp)</button></div></div>`;
  return `<div class="freigabe"><h3>Entscheidung nötig</h3>
   <div>${entscheidungStandard()}</div>
   <div class="akt"><input type="text" id="ausgrund${k}" placeholder="Begründung (Pflicht), z. B. Reste geprüft, klingt richtig" size="52">
    <button class="haupt" onclick="entscheide('frei','${k}')">Freigeben – weiter in der Kette</button>
    <button onclick="entscheide('stopp','${k}')">Anhalten (Stopp)</button></div></div>`;
}
// UX-Durchgang 23.11.2026: Laientext + nächster Schritt für Monitore ohne eigene Fassung (Texte: config/stage_hilfe.json)
function entscheidungStandard(){
  const s=M.stage,h=HILFE[s.stage]||{},n=(s.befunde||[]).length||(s.gruende||[]).length;
  const t=Object.values(s.teile||{}).filter(x=>x.zustand=="mensch").length;
  return `${h.warum?`<p><b>Worum es geht:</b> ${esc(h.warum)}</p>`:""}
   <p><b>Warum die Stage wartet:</b> ${n?`Die automatische Prüfung hat ${n} Auffälligkeit${n>1?"en":""} gefunden – Details oben unter „Befunde“.`:"Hier entscheidet bewusst ein Mensch."}${t?` Offen sind ${t} Teil${t>1?"e":""}.`:""}</p>
   ${h.mensch?`<p><b>Was du tun kannst:</b> ${esc(h.mensch)}</p>`:""}
   <p>Ist alles in Ordnung: kurze Begründung eintragen und freigeben${t?" (das gibt auch die offenen Teile frei)":""}. Sonst unten korrigieren und „Übernehmen“ drücken – die Stage prüft dann neu.</p>`;
}
function naechsterStandard(){
  const s=M.stage,st=s.stage,z=s.zustand,darf=M.rechte.lauf.ok;
  if(s.nachbar)return schritt(`${st} läuft automatisch mit Stage ${s.nachbar}.`,`<a class="knopf haupt" href="#${esc(M.book_id)}/${s.nachbar}">→ ${s.nachbar} öffnen</a>`);
  if(LAUF&&LAUF.laeuft)return schritt("Es läuft gerade ein Lauf. Bitte warten – Fortschritt und Log stehen unten unter „Lauf“.","");
  if(z=="mensch"&&s.nur_kosten)return schritt(`${st} wartet nur auf die Kostenfreigabe. Kosten unten je Sprache prüfen und dort freigeben.`,"");
  if(z=="mensch")return schritt("Oben im Kasten „Entscheidung nötig“ lesen, was die Stage gefunden hat. Passt es: dort freigeben. Sonst unten korrigieren und „Übernehmen“.","");
  if(z=="stopp")return (s.ruecksprung_ziele||[]).some(x=>x.ziel&&x.ziel!=st)
    ?schritt(`${st} ist angehalten. Ursache steht oben unter „Befunde“ – mit „Rücksprung“ an die Stelle springen, die das Problem verursacht, oder unten korrigieren und neu prüfen.`,"")
    :schritt(`${st} ist angehalten. Ursache steht oben unter „Befunde“.${(HILFE[st]||{}).mensch?" Was hilft: "+esc(HILFE[st].mensch):""} Danach unten „Übernehmen“.`,"");
  if(["frei","auto","entfaellt"].includes(z)){
    if((s.fehlende_teile||[]).length)return schritt(`${st} ist frei, aber es fehlen Teile: ${s.fehlende_teile.map(esc).join(", ")}.`,darf?`<button class="haupt" onclick="pruefen()">${st} für die fehlenden Teile starten</button>`:"");

    return schrittFertig(st);
  }
  const k=M.kette,i=k.findIndex(x=>x.stage==st),v=k.slice(0,i).find(x=>!x.nachbar&&!["frei","auto","entfaellt"].includes(x.zustand));

  return schritt(`${st} ist noch nicht gelaufen.`,darf?`<button class="haupt" onclick="pruefen()">${st} starten</button>`:"");
}

let ERG=[],ergWahl=null;
async function ergebnisLaden(){
  const r=await api(`/api/werk/${B()}/ergebnis/${M.stage.stage}`);ERG=r.dateien||[];
  const gr=n=>n>1e6?(n/1e6).toFixed(1)+" MB":n>1e3?Math.round(n/1e3)+" kB":n+" B";
  if(!ERG.length){$("ergebnis").innerHTML=`<h2>Ergebnis</h2><div class="klein">${r.fehler?esc(r.fehler):"Diese Stage hat (noch) keine Ergebnisdateien."}</div>`;return;}
  if(!ERG.find(x=>x.datei==ergWahl))ergWahl=ERG[0].datei;
  $("ergebnis").innerHTML=`<h2>Ergebnis <span class="klein">${ERG.length} Datei(en)${r.gekappt?" (gekappt)":""}</span></h2>
   <div class="dateien">${ERG.map((x,i)=>`<button class="${x.datei==ergWahl?"akt":""}" title="${esc(x.datei)} · ${esc(x.wann.replace("T"," "))}" onclick="ergZeigen(${i})">${esc(x.name)} <span class="klein">${gr(x.groesse)}</span></button>`).join("")}</div>
   <div id="ansicht"></div>`;
  ergZeigen(ERG.findIndex(x=>x.datei==ergWahl));
}
async function ergZeigen(i){
  const x=ERG[i];ergWahl=x.datei;
  document.querySelectorAll("#ergebnis .dateien button").forEach((b,k)=>b.className=k==i?"akt":"");
  const url="/datei?p="+encodeURIComponent(x.datei),a=$("ansicht");
  const kopf=`<div class="klein" style="margin-bottom:8px">${esc(x.datei)} · ${esc(x.wann.replace("T"," "))} · <a target="_blank" href="${url}">roh öffnen</a></div>`;
  if(x.art=="bild"){a.innerHTML=kopf+`<img src="${url}">`;return;}
  if(x.art=="audio"){a.innerHTML=kopf+`<audio controls preload="none" src="${url}" style="width:100%"></audio>`;return;}
  if(x.art=="datei"){a.innerHTML=kopf+`<div class="klein">Binärdatei – nur „roh öffnen“.</div>`;return;}
  if(x.groesse>30e6){a.innerHTML=kopf+`<div class="klein">Zu groß für die Ansicht.</div>`;return;}
  a.innerHTML=kopf+`<div class="klein">lädt …</div>`;
  const t=await (await fetch(url)).text();
  if(x.art=="json"){
    let v=null;
    try{v=x.datei.endsWith(".jsonl")?t.split(/\r?\n/).filter(Boolean).map(z=>JSON.parse(z)):JSON.parse(t);}catch(e){}
    if(v!==null){a.innerHTML=kopf;const b=document.createElement("div");b.className="jb";b.appendChild(jsonKnoten(v,null,true));a.appendChild(b);return;}
  }
  const max=200000;a.innerHTML=kopf+`<pre style="max-height:600px">${esc(t.slice(0,max))}</pre>`+(t.length>max?`<div class="klein">… gekürzt (${t.length.toLocaleString("de")} Zeichen) – „roh öffnen“ zeigt alles.</div>`:"");
}
function jsonKnoten(v,k,offen){
  const key=k===null?"":`<span class="k">${esc(k)}</span>: `;
  if(v===null||typeof v!="object"){
    const d=document.createElement("div");d.className="zeile";
    d.innerHTML=key+(typeof v=="string"?`<span class="s">"${esc(v)}"</span>`:`<span class="zahl">${esc(String(v))}</span>`);return d;
  }
  const arr=Array.isArray(v),keys=arr?null:Object.keys(v),n=arr?v.length:keys.length;
  const det=document.createElement("details");
  const vor=arr?"[":"{",nach=arr?"]":"}";
  let kurz="";if(!arr){kurz=keys.slice(0,4).join(", ")+(n>4?", …":"");}
  det.innerHTML=`<summary>${key}${vor} <span class="n">${n} ${arr?"Einträge":"Felder"}${kurz?" · "+esc(kurz):""}</span> ${nach}</summary>`;
  let gebaut=0;const SCHRITT=200;
  const mehr=()=>{
    const bis=Math.min(n,gebaut+SCHRITT);
    for(let i=gebaut;i<bis;i++)det.appendChild(arr?jsonKnoten(v[i],i,false):jsonKnoten(v[keys[i]],keys[i],false));
    gebaut=bis;det.querySelector(":scope>.mehr")?.remove();
    if(gebaut<n){const b=document.createElement("button");b.className="mehr";b.style.margin="4px 0 4px 28px";b.textContent=`weitere ${Math.min(SCHRITT,n-gebaut)} von ${n-gebaut}`;b.onclick=mehr;det.appendChild(b);}
  };
  det.addEventListener("toggle",()=>{if(det.open&&!gebaut)mehr();});
  if(offen&&n){det.open=true;mehr();}
  return det;
}

function laufZeigen(l){
  clearTimeout(poll);
  const vorher=!!(LAUF&&LAUF.laeuft);LAUF=l||null;
  if(M&&vorher!=!!(l&&l.laeuft))gateZeigen();
  if(!l){$("laufbox").style.display="none";return;}

  const farbe={frei:"var(--g)",mensch:"var(--a)",stopp:"var(--r)",fehler:"var(--r)"}[l.deutung]||"var(--b)";
  $("laufinfo").innerHTML=`<b>${esc(l.art)}</b> · ${esc(l.start)} · <span style="color:${farbe}">${l.laeuft?"läuft …":"Exit "+l.exit+" = "+esc(l.deutung)}</span>`;

  if(l.laeuft){sahLaufen=true;poll=setTimeout(async()=>laufZeigen(await api(`/api/werk/${B()}/lauf`)),1500);}

  tl(i,pos){

  bearb(tid){const t=this.T[tid],seg=this.S(this.lg)[tid]||t.seg,tok=[],spk={};
