<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hörtest Prosodie v0.1</title>
<style>
:root{--bg:#f6f4ef;--fg:#1d1c1a;--mut:#6b675f;--line:#ddd8cc;--card:#fff;--acc:#2f5d8a;--b:#8a4b2f}
@media (prefers-color-scheme:dark){:root{--bg:#181816;--fg:#ece9e2;--mut:#9a958b;--line:#34322d;--card:#22211e;--acc:#7fb0e0;--b:#e0a07f}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 4px} .mut{color:var(--mut);font-size:13px}
.satz{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0}
.kopf{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.id{font-weight:700}
code{font-size:14px;white-space:pre-wrap;word-break:break-word}
details{margin:6px 0;font-size:12px;color:var(--mut)}
.reihe{display:grid;grid-template-columns:28px minmax(0,1fr) repeat(5,auto);gap:6px;align-items:center;margin-top:6px}
.reihe b{color:var(--acc)} .reihe.b b{color:var(--b)}
audio{width:100%;height:32px} select{font-size:13px}
.leg{display:grid;grid-template-columns:28px minmax(0,1fr) repeat(5,48px);gap:6px;font-size:12px;color:var(--mut)}
textarea{width:100%;box-sizing:border-box;margin-top:6px;font:13px system-ui;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;font-size:13px}td,th{border:1px solid var(--line);padding:3px 8px;text-align:center}
button{font:14px system-ui;padding:6px 12px;margin:4px 4px 0 0}
@media (max-width:640px){.reihe{grid-template-columns:24px minmax(0,1fr)}.reihe select{grid-column:span 1}}
</style></head><body><main>
<h1>Hörtest Prosodie-Vokabelheft v0.1</h1>
<p class="mut">A = ohne Markup, B = mit Markup (gleiche Stimme, gleicher Seed). Je Fassung 1–5: <b>V</b> Verständlichkeit · <b>S</b> Stimmung · <b>B</b> Betonung · <b>P</b> Pausen · <b>A</b> Artefakte (5 = keine). Wird im Browser gespeichert.</p>
<div id="summe"></div>
<button onclick="csv()">CSV speichern</button><button onclick="if(confirm('Alle Bewertungen löschen?')){R={};speichern();bauen()}">Zurücksetzen</button>
<div id="liste"></div>
</main><script>
const D=[{"id": "DE01", "lang": "de", "label": "neutral, Baseline (Satzmelodie, Rhythmus)", "markup": "Am Morgen lag der Nebel noch über den Wiesen, und der Fluss zog still an den Weiden vorbei.", "chunks": ["😐 ex 0.5 cfg 0.5 | Am Morgen lag der Nebel noch über den Wiesen, und der Fluss zog still an den Weiden vorbei."]}, {"id": "DE02", "lang": "de", "label": "fröhlich", "markup": "😄 Endlich Ferien! Wir packen die Koffer, wir nehmen den frühen Zug, und heute Abend sitzen wir am Meer.", "chunks": ["😄 ex 0.8 cfg 0.45 | Endlich Ferien! Wir packen die Koffer, wir nehmen den frühen Zug, und heute Abend sitzen wir am Meer."]}, {"id": "DE03", "lang": "de", "label": "traurig", "markup": "😢 Das Haus war leer, nur der Stuhl am Fenster stand noch dort, wo sie immer gesessen hatte.", "chunks": ["😢 ex 0.35 cfg 0.3 | Das Haus war leer, nur der Stuhl am Fenster stand noch dort, wo sie immer gesessen hatte."]}, {"id": "DE04", "lang": "de", "label": "wütend mit Betonung", "markup": "😠 Ich habe dir *gesagt*, dass du die Tür nicht offen lassen sollst, und du hast es *schon wieder* vergessen!", "chunks": ["😠 ex 1.0 cfg 0.3 | Ich habe dir", "⏸ 0 ms", "😠 ex 1.15 cfg 0.3 | gesagt,", "⏸ 150 ms", "😠 ex 1.0 cfg 0.3 | dass du die Tür nicht offen lassen sollst, und du hast es", "⏸ 0 ms", "😠 ex 1.15 cfg 0.3 | schon wieder", "⏸ 0 ms", "😠 ex 1.0 cfg 0.3 | vergessen!"]}, {"id": "DE05", "lang": "de", "label": "flüsternd", "markup": "🤫 Leise jetzt, || sie schlafen noch. Wenn wir die Treppe hinunter wollen, müssen wir an der dritten Stufe vorbei.", "chunks": ["🤫 ex 0.3 cfg 0.3 | Leise jetzt,", "⏸ 600 ms", "🤫 ex 0.3 cfg 0.3 | sie schlafen noch. Wenn wir die Treppe hinunter wollen, müssen wir an der dritten Stufe vorbei."]}, {"id": "DE06", "lang": "de", "label": "erschrocken", "markup": "😱 Hinter ihm krachte die Tür ins Schloss, und im selben Augenblick erlosch das Licht!", "chunks": ["😱 ex 1.1 cfg 0.5 | Hinter ihm krachte die Tür ins Schloss, und im selben Augenblick erlosch das Licht!"]}, {"id": "DE07", "lang": "de", "label": "nachdenklich mit Pausen", "markup": "🤔 Vielleicht | war es gar nicht der Zufall, || der uns hierher geführt hat, | sondern etwas, das wir nicht sehen konnten.", "chunks": ["🤔 ex 0.4 cfg 0.3 | Vielleicht", "⏸ 375 ms", "🤔 ex 0.4 cfg 0.3 | war es gar nicht der Zufall,", "⏸ 900 ms", "🤔 ex 0.4 cfg 0.3 | der uns hierher geführt hat,", "⏸ 375 ms", "🤔 ex 0.4 cfg 0.3 | sondern etwas, das wir nicht sehen konnten."]}, {"id": "DE08", "lang": "de", "label": "liebevoll", "markup": "🥰 Komm her, mein Kleiner. Es ist alles gut, ich bin ja da, und morgen früh gehen wir zusammen zu den Enten.", "chunks": ["🥰 ex 0.5 cfg 0.35 | Komm her, mein Kleiner. Es ist alles gut, ich bin ja da, und morgen früh gehen wir zusammen zu den Enten."]}, {"id": "DE09", "lang": "de", "label": "verschmitzt", "markup": "😏 Natürlich habe ich nichts gesehen. Ich war ja die ganze Zeit hier, genau neben dem leeren Kuchenteller.", "chunks": ["😏 ex 0.7 cfg 0.4 | Natürlich habe ich nichts gesehen. Ich war ja die ganze Zeit hier, genau neben dem leeren Kuchenteller."]}, {"id": "DE10", "lang": "de", "label": "ironisch", "markup": "🙄 Oh, großartig. Noch ein Meeting, das auch eine E-Mail hätte sein können.", "chunks": ["🙄 ex 0.7 cfg 0.4 | Oh, großartig. Noch ein Meeting, das auch eine E-Mail hätte sein können."]}, {"id": "DE11", "lang": "de", "label": "Dialog, Sprecherwechsel", "markup": "@Erzähler: Anna blieb an der Tür stehen. @Anna: 🤔 Und wenn er nicht zurückkommt? @Max: 🙂 Er kommt zurück. Er kommt immer zurück.", "chunks": ["😐 ex 0.5 cfg 0.5 | Anna blieb an der Tür stehen.", "⏸ 400 ms", "🤔 ex 0.4 cfg 0.3 | Und wenn er nicht zurückkommt?", "⏸ 600 ms", "🙂 ex 0.6 cfg 0.5 | Er kommt zurück. Er kommt immer zurück."]}, {"id": "DE12", "lang": "de", "label": "Zahlen, Namen, Lexikon", "markup": "Am 14. März 1848 reiste {Wilhelmine|Vilhelmine} Schmidt mit 3 Koffern und 250 Mark nach Zürich.", "chunks": ["😐 ex 0.5 cfg 0.5 | Am 14. März 1848 reiste Vilhelmine Schmidt mit 3 Koffern und 250 Mark nach Zürich."]}, {"id": "DE13", "lang": "de", "label": "archaisches Vokabular", "markup": "Gar sehr verwunderte sich der Alte ob solcher Rede, und er sprach: Wohlan, so lasst uns denn des Weges ziehen.", "chunks": ["😐 ex 0.5 cfg 0.5 | Gar sehr verwunderte sich der Alte ob solcher Rede, und er sprach: Wohlan, so lasst uns denn des Weges ziehen."]}, {"id": "DE14", "lang": "de", "label": "langer Schachtelsatz", "markup": "Der Mann, der gestern Abend, als es schon dunkel wurde und die Laternen angezündet waren, noch vor dem Haus gestanden hatte, kam nicht mehr wieder.", "chunks": ["😐 ex 0.5 cfg 0.5 | Der Mann, der gestern Abend, als es schon dunkel wurde und die Laternen angezündet waren, noch vor dem Haus gestanden hatte, kam nicht mehr wieder."]}, {"id": "DE15", "lang": "de", "label": "Tempo und Szenenpause", "markup": "🐢 Langsam öffnete sie den Brief. ||| 🐇 Und dann ging alles ganz schnell: Wir rannten die Treppe hinab, durch den Hof und auf die Straße!", "chunks": ["😐 ex 0.5 cfg 0.35 | Langsam öffnete sie den Brief.", "⏸ 1200 ms", "😐 ex 0.5 cfg 0.65 | Und dann ging alles ganz schnell: Wir rannten die Treppe hinab, durch den Hof und auf die Straße!"]}, {"id": "EN01", "lang": "en", "label": "neutral, Baseline", "markup": "By the time the lamps were lit, the street had emptied, and only the sound of the river remained.", "chunks": ["😐 ex 0.5 cfg 0.5 | By the time the lamps were lit, the street had emptied, and only the sound of the river remained."]}, {"id": "EN02", "lang": "en", "label": "überrascht", "markup": "😮 You came all this way? I had no idea, I really thought you were still abroad!", "chunks": ["😮 ex 0.9 cfg 0.5 | You came all this way? I had no idea, I really thought you were still abroad!"]}, {"id": "EN03", "lang": "en", "label": "ängstlich", "markup": "😨 Something moved in the cellar. I heard it twice, and both times it was closer than before.", "chunks": ["😨 ex 0.8 cfg 0.35 | Something moved in the cellar. I heard it twice, and both times it was closer than before."]}, {"id": "EN04", "lang": "en", "label": "müde", "markup": "😴 I haven't slept properly in days, and the letters on the page keep sliding away from me.", "chunks": ["😴 ex 0.25 cfg 0.25 | I haven't slept properly in days, and the letters on the page keep sliding away from me."]}, {"id": "EN05", "lang": "en", "label": "dramatisch/feierlich", "markup": "🎭 And so, upon the last night of the old kingdom, || the bells rang out over the silent towers.", "chunks": ["🎭 ex 0.9 cfg 0.3 | And so, upon the last night of the old kingdom,", "⏸ 600 ms", "🎭 ex 0.9 cfg 0.3 | the bells rang out over the silent towers."]}, {"id": "EN06", "lang": "en", "label": "freundlich", "markup": "🙂 Good morning! Come in, sit down, and let me put the kettle on. You must be freezing.", "chunks": ["🙂 ex 0.6 cfg 0.5 | Good morning! Come in, sit down, and let me put the kettle on. You must be freezing."]}, {"id": "EN07", "lang": "en", "label": "wütend mit Betonung", "markup": "😠 I told you *twice* not to touch the lock, and now the whole door is ruined!", "chunks": ["😠 ex 1.0 cfg 0.3 | I told you", "⏸ 0 ms", "😠 ex 1.15 cfg 0.3 | twice", "⏸ 0 ms", "😠 ex 1.0 cfg 0.3 | not to touch the lock, and now the whole door is ruined!"]}, {"id": "EN08", "lang": "en", "label": "Dialog, Sprecherwechsel", "markup": "@Narrator: The captain turned from the window. @Captain: 🤔 How many days of water do we have left? @Mate: 😨 Four, sir. Perhaps five.", "chunks": ["😐 ex 0.5 cfg 0.5 | The captain turned from the window.", "⏸ 400 ms", "🤔 ex 0.4 cfg 0.3 | How many days of water do we have left?", "⏸ 600 ms", "😨 ex 0.8 cfg 0.35 | Four, sir. Perhaps five."]}, {"id": "EN09", "lang": "en", "label": "Namen, Lexikon", "markup": "Ms. {Featherstonehaugh|Fanshaw} arrived at 7:45 on the 3rd of November, carrying 12 letters for Mr. {Cholmondeley|Chumley}.", "chunks": ["😐 ex 0.5 cfg 0.5 | Ms. Fanshaw arrived at 7:45 on the 3rd of November, carrying 12 letters for Mr. Chumley."]}, {"id": "EN10", "lang": "en", "label": "archaisch", "markup": "Thou shalt not pass, quoth the old knight, for I have sworn an oath upon this bridge, and none shall break it.", "chunks": ["😐 ex 0.5 cfg 0.5 | Thou shalt not pass, quoth the old knight, for I have sworn an oath upon this bridge, and none shall break it."]}, {"id": "EN11", "lang": "en", "label": "langer Satz mit Kommas", "markup": "He walked slowly, hat in hand, through the long gallery, past the portraits of men he had never met, and out into the garden.", "chunks": ["😐 ex 0.5 cfg 0.5 | He walked slowly, hat in hand, through the long gallery, past the portraits of men he had never met, and out into the garden."]}, {"id": "EN12", "lang": "en", "label": "Betonung in der Satzmitte", "markup": "I did not say *he* stole the money. | I only said that someone did.", "chunks": ["😐 ex 0.5 cfg 0.5 | I did not say", "⏸ 0 ms", "😐 ex 0.65 cfg 0.5 | he", "⏸ 0 ms", "😐 ex 0.5 cfg 0.5 | stole the money.", "⏸ 250 ms", "😐 ex 0.5 cfg 0.5 | I only said that someone did."]}, {"id": "EN13", "lang": "en", "label": "traurig", "markup": "😢 The last train had gone, and she stood alone on the platform, holding a ticket for nowhere.", "chunks": ["😢 ex 0.35 cfg 0.3 | The last train had gone, and she stood alone on the platform, holding a ticket for nowhere."]}, {"id": "EN14", "lang": "en", "label": "Tempo und Pause", "markup": "🐢 Wait. || Listen. ||| 🐇 Now run, run, run, before they close the gates behind us!", "chunks": ["😐 ex 0.5 cfg 0.35 | Wait.", "⏸ 600 ms", "😐 ex 0.5 cfg 0.35 | Listen.", "⏸ 1200 ms", "😐 ex 0.5 cfg 0.65 | Now run, run, run, before they close the gates behind us!"]}, {"id": "EN15", "lang": "en", "label": "Intensität (Verdopplung) und Frage/Ausruf", "markup": "😠😠 How dare you stand there and ask me why? Get out of my house!", "chunks": ["😠 ex 1.2 cfg 0.3 | How dare you stand there and ask me why? Get out of my house!"]}];
const K=["V","S","B","P","A"];let R={};
try{R=JSON.parse(localStorage.getItem("prosodie_v01")||"{}")}catch(e){}
function speichern(){try{localStorage.setItem("prosodie_v01",JSON.stringify(R))}catch(e){}summe()}
function sel(id,v,k){const s=document.createElement("select");s.title=k;s.innerHTML=`<option value="">${k}</option>`+[1,2,3,4,5].map(n=>`<option>${n}</option>`).join("");
 s.value=(R[id]?.[v]?.[k])||"";s.onchange=()=>{R[id]=R[id]||{};R[id][v]=R[id][v]||{};R[id][v][k]=s.value;speichern()};return s}
function bauen(){const L=document.getElementById("liste");L.innerHTML="";
 for(const s of D){const c=document.createElement("div");c.className="satz";
  c.innerHTML=`<div class="kopf"><span class="id">${s.id}</span><span class="mut">${s.label}</span></div><code></code>
  <details><summary>Chunks (B)</summary><div>${s.chunks.map(x=>x.replace(/</g,"&lt;")).join("<br>")}</div></details>`;
  c.querySelector("code").textContent=s.markup;
  for(const v of ["a","b"]){const r=document.createElement("div");r.className="reihe "+v;
   r.innerHTML=`<b>${v.toUpperCase()}</b><audio controls preload="none" src="audio/${s.id}_${v}.wav"></audio>`;
   K.forEach(k=>r.appendChild(sel(s.id,v,k)));c.appendChild(r)}
  const t=document.createElement("textarea");t.rows=1;t.placeholder="Notiz";t.value=R[s.id]?.notiz||"";
  t.oninput=()=>{R[s.id]=R[s.id]||{};R[s.id].notiz=t.value;speichern()};c.appendChild(t);L.appendChild(c)}
 summe()}
function mittel(f){let x=[];for(const s of D.filter(f.s))for(const k of [f.k]){const w=R[s.id]?.[f.v]?.[k];if(w)x.push(+w)}return x.length?(x.reduce((a,b)=>a+b,0)/x.length).toFixed(2):"–"}
function summe(){let h="<table><tr><th></th>"+K.map(k=>`<th colspan=2>${k}</th>`).join("")+"</tr><tr><th></th>"+K.map(()=>"<th>A</th><th>B</th>").join("")+"</tr>";
 for(const [n,f] of [["DE",s=>s.lang=="de"],["EN",s=>s.lang=="en"],["alle",s=>true]])
  h+=`<tr><th>${n}</th>`+K.map(k=>`<td>${mittel({s:f,v:"a",k})}</td><td>${mittel({s:f,v:"b",k})}</td>`).join("")+"</tr>";
 const n=D.filter(s=>R[s.id]?.b&&Object.keys(R[s.id].b).length).length;
 document.getElementById("summe").innerHTML=h+`</table><p class="mut">${n} von ${D.length} Sätzen bewertet</p>`}
function csv(){let z=["id;sprache;label;"+K.map(k=>"A_"+k).join(";")+";"+K.map(k=>"B_"+k).join(";")+";notiz"];
 for(const s of D){const r=R[s.id]||{};z.push([s.id,s.lang,s.label,...K.map(k=>r.a?.[k]||""),...K.map(k=>r.b?.[k]||""),(r.notiz||"").replace(/[;\n]/g," ")].join(";"))}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+z.join("\n")],{type:"text/csv"}));a.download="bewertung_prosodie_v01.csv";a.click()}
bauen();
</script></body></html>
